<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldSOC — Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #060d1a;
            --surface: #0d1b2e;
            --border: #1a3050;
            --cyan: #00d4ff;
            --red: #ff3d57;
            --green: #00e676;
            --text: #e8f0fe;
            --muted: #7a9cc0;
            --dim: #4a6580;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background grid effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* Brand */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #0057b7 0%, #00d4ff 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 14px;
            box-shadow: 0 0 32px rgba(0, 212, 255, 0.2);
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 20px;
        }

        /* Form */
        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            background: #060d1a;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 10px 12px;
            outline: none;
            transition: border-color .15s;
        }

        .field input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.12);
        }

        /* Button */
        .btn-login {
            width: 100%;
            background: var(--cyan);
            color: #060d1a;
            border: none;
            border-radius: 7px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 11px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity .15s, transform .1s;
            letter-spacing: .03em;
        }

        .btn-login:hover {
            opacity: .88;
        }

        .btn-login:active {
            transform: scale(.98);
        }

        .btn-login:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* Error */
        .error-msg {
            background: rgba(255, 61, 87, .12);
            border: 1px solid rgba(255, 61, 87, .3);
            border-radius: 6px;
            color: var(--red);
            font-size: 12px;
            padding: 9px 12px;
            margin-bottom: 16px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--dim);
        }

        /* Spinner */
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(6, 13, 26, .4);
            border-top-color: #060d1a;
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
    </style>
</head>

<body>

    <div class="login-wrap">

        <div class="brand">
            <div class="brand-icon">🛡</div>
            <div class="brand-name">ShieldSOC</div>
            <div class="brand-sub">DDoS Detection Platform</div>
        </div>

        <div class="card">
            <div class="card-title">🔐 Analyst Login</div>

            <div class="error-msg" id="errMsg">Invalid username or password.</div>

            <div class="field">
                <label>Username</label>
                <input id="username" type="text" placeholder="admin" autocomplete="username" autofocus>
            </div>

            <div class="field">
                <label>Password</label>
                <input id="password" type="password" placeholder="••••••••••" autocomplete="current-password"
                    onkeydown="if(event.key==='Enter') doLogin()">
            </div>

            <button class="btn-login" id="loginBtn" onclick="doLogin()">
                Sign In
            </button>
        </div>

        <div class="login-footer">
            ShieldSOC v1.0 · Astana IT University · Danial Otegen 2025
        </div>

    </div>

    <script>
        "use strict"

        async function doLogin() {
            const username = document.getElementById("username").value.trim()
            const password = document.getElementById("password").value
            const btn = document.getElementById("loginBtn")
            const err = document.getElementById("errMsg")

            if (!username || !password) {
                err.innerText = "Please enter username and password."
                err.classList.add("show")
                return
            }

            btn.disabled = true
            btn.innerHTML = '<span class="spinner"></span>Authenticating…'
            err.classList.remove("show")

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                })
                const data = await res.json()

                if (res.ok && data.token) {
                    // Token stored as cookie by server — redirect to dashboard
                    const next = new URLSearchParams(location.search).get("next") || "/"
                    window.location.href = next
                } else {
                    err.innerText = data.detail || "Invalid username or password."
                    err.classList.add("show")
                    btn.disabled = false
                    btn.innerHTML = "Sign In"
                    document.getElementById("password").value = ""
                }
            } catch (e) {
                err.innerText = "Connection error. Is the server running?"
                err.classList.add("show")
                btn.disabled = false
                btn.innerHTML = "Sign In"
            }
        }
    </script>

</body>

</html>
